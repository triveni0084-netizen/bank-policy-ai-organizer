version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bank_policy_postgres
    environment:
      POSTGRES_USER: bankpolicy
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: bank_policy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankpolicy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-policy-network

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: bank_policy_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: bankpolicy
      MONGO_INITDB_ROOT_PASSWORD: secure_password_123
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - bank-policy-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bank_policy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bank-policy-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: bank_policy_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - bank-policy-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bank_policy_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://bankpolicy:secure_password_123@postgres:5432/bank_policy_db
      MONGODB_URL: mongodb://bankpolicy:secure_password_123@mongodb:27017/bank_policy_documents
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - bank-policy-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank_policy_frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
      REACT_APP_SOCKET_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - bank-policy-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bank_policy_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bank-policy-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:

networks:
  bank-policy-network:
    driver: bridge